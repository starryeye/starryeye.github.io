<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<title>보건 임용 압축노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f5f1;--surface:#fff;--surface2:#faf9f6;--text:#1d1f23;--muted:#6b6f76;--line:#e6e3dc;
  --accent:#0e7c6b;--accent-soft:#e3f2ef;--star:#c77d0a;--star2:#3b82c4;--star1:#8b6cc9;
  --mark:#ffe7a0;--mark-hidden:#efe9da;--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121416;--surface:#1a1d20;--surface2:#16191b;--text:#e8e6e1;--muted:#9aa0a6;--line:#2a2e33;
  --accent:#4fbfa8;--accent-soft:#18332e;--star:#f0b44c;--star2:#7fb4ea;--star1:#b9a2ef;
  --mark:rgba(255,200,80,.28);--mark-hidden:#2c2a24;--shadow:none;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
/* lock */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);text-align:center}
.lock-card h1{font-size:20px;margin:6px 0 4px;letter-spacing:-.02em}
.lock-card p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.pin{width:100%;font:inherit;font-size:22px;letter-spacing:.5em;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text)}
.pin:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 16px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:12px}
.lock .rem{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;font-size:13px;color:var(--muted)}
.err{color:#d14343;font-size:13px;min-height:1.4em;margin-top:8px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:6px;height:52px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.icon-btn:active{background:var(--line)}
.top-title{flex:1;min-width:0;line-height:1.25}
.top-title small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* menu sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);visibility:hidden;transition:transform .2s ease,visibility .2s;max-width:680px;margin:0 auto}
.sheet.on{transform:none;visibility:visible}.sheet-bg.on{display:block}
.sheet a,.sheet button{display:flex;width:100%;align-items:center;gap:10px;padding:13px 6px;border-bottom:1px solid var(--line);text-decoration:none;font-size:15px}
.sheet a:last-child,.sheet button:last-child{border-bottom:0}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
/* home */
.hero{padding:22px 0 8px}
.hero h1{font-size:24px;line-height:1.3;margin:0 0 6px;letter-spacing:-.03em}
.hero p{margin:0;color:var(--muted);font-size:14px}
.sec-t{font-size:13px;color:var(--muted);font-weight:600;margin:22px 2px 8px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);text-decoration:none;margin-bottom:10px}
.lv{display:flex;gap:14px;align-items:flex-start}
.lv-n{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.lv h3{margin:0;font-size:16px}
.lv p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.lv .when{display:inline-block;margin-top:6px;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;font-weight:600}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px}
.resume small{color:var(--muted);display:block;font-size:12px}
.chev{color:var(--muted);font-size:18px}
/* level index */
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .cnt{font-weight:500;opacity:.7;margin-left:3px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.row .no{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);width:30px}
.row .tt{flex:1;min-width:0;font-size:14.5px}
.row .pg{font-size:12px;color:var(--muted)}
.row.off{opacity:.38;pointer-events:none}
.row .ok{color:var(--accent);font-weight:800;width:16px;text-align:center}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
/* set view */
.set-h{padding:18px 0 6px}
.set-h .crumb{font-size:12.5px;color:var(--muted)}
.set-h h2{margin:2px 0 0;font-size:21px;line-height:1.35;letter-spacing:-.02em}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tg[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted);margin:2px 2px 0}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px 12px;margin:10px 0;box-shadow:var(--shadow)}
.topic.s3{border-left:4px solid var(--star)}
.t-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-bottom:6px}
.t-no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-t{font-weight:700;font-size:15.5px}
.st{font-size:12px;letter-spacing:-.04em;font-weight:700}
.st3{color:var(--star)}.st2{color:var(--star2)}.st1{color:var(--star1)}.st0{color:var(--muted);font-weight:400}
.t-m{font-size:11.5px;color:var(--muted);margin-left:auto}
.lines{margin:0;padding:0;list-style:none}
.lines>li{position:relative;padding-left:13px;margin:3px 0;font-size:14.5px}
.lines>li::before{content:"";position:absolute;left:2px;top:.72em;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.lines .lb{font-weight:700;color:var(--accent);margin-right:2px}
.subs{margin:3px 0 4px;padding-left:2px;list-style:none;counter-reset:s}
.subs li{counter-increment:s;padding-left:20px;position:relative;margin:2px 0}
.subs li::before{content:counter(s);position:absolute;left:0;top:.25em;width:15px;height:15px;border-radius:50%;background:var(--line);font-size:10px;line-height:15px;text-align:center;color:var(--muted);font-weight:700}
.k{font-weight:700;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 1px;border-radius:2px}
.blank .k,.blank .kb{color:transparent!important;background:var(--mark-hidden);border-bottom:2px solid var(--star);cursor:pointer;user-select:none}
.blank .k.show,.blank .kb.show{color:inherit!important;background:linear-gradient(transparent 58%,var(--mark) 58%);border-bottom-color:transparent}
.toponly .topic:not(.s3):not(.s2){display:none}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.tree .lines>li{font-size:15px;margin:7px 0}
.blk-t{font-size:14px;font-weight:700;margin:20px 2px 8px;display:flex;gap:8px;align-items:baseline}
.blk-t small{font-weight:500;color:var(--muted);font-size:12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.5}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:5.5em}
tr:last-child th,tr:last-child td{border-bottom:0}
thead th{background:var(--surface2);font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
tbody th{font-weight:700;background:var(--surface2);white-space:nowrap}
td+td,th+td{border-left:1px solid var(--line)}
.pgc{color:var(--muted);font-size:12px;white-space:nowrap}
.d1-row{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.d1-row .t-no{width:30px;flex:0 0 auto;padding-top:2px}
.d1-row b{display:block;font-size:14.5px}
.d1-row div{font-size:14px}
.must{background:var(--surface);border:1.5px dashed var(--star);border-radius:14px;padding:12px 16px 12px 32px;margin:10px 0}
.must li{margin:5px 0}
/* bottom nav */
.botnav{position:sticky;bottom:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);margin-top:24px}
.botnav .wrap{display:flex;gap:8px;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.nb{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;font-size:13.5px;font-weight:600;text-align:center;text-decoration:none;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb.dis{opacity:.35;pointer-events:none}
.nb.read[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
/* guide */
.g h2{font-size:18px;margin:26px 0 8px}
.g p,.g li{font-size:14.5px}
.g ul{padding-left:18px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:baseline}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:28px 0 40px}
.empty{color:var(--muted);text-align:center;padding:48px 0}
</style>
</head>
<body>
<div id="lock" class="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <div style="font-size:30px">🩺</div>
    <h1>보건 임용 압축노트</h1>
    <p>비밀번호를 입력하세요</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" maxlength="12" aria-label="비밀번호" autofocus>
    <button class="btn btn-primary" id="go" type="submit">열기</button>
    <label class="rem"><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden>
  <header class="top"><div class="wrap">
    <button class="icon-btn" id="back" aria-label="뒤로">‹</button>
    <div class="top-title"><small id="crumb"></small><b id="ttl"></b></div>
    <button class="icon-btn" id="menuBtn" aria-label="메뉴">☰</button>
  </div></header>
  <main id="view"></main>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<nav class="sheet" id="sheet" aria-label="메뉴">
  <div class="grab"></div>
  <a href="#/">🏠 홈</a>
  <a href="#/guide">📖 처음 보는 분께 (가이드)</a>
  <a href="#/L1">① L1 압축본</a>
  <a href="#/L2">② L2 키워드 트리</a>
  <a href="#/BC">③ 숫자·비교표</a>
  <a href="#/D1">④ D-1 시트</a>
  <button id="lockBtn">🔒 잠그기</button>

function decrypt(pw){var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey'])
   .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
   .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.n)},key,b64(P.c))})
   .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function kw(s){return esc(s).replace(/\{\{(.+?)\}\}/g,'<span class="k">$1</span>')}
var STAR={3:'★★★',2:'★★',1:'★',0:'☆'};
var LV={L1:{n:'①',name:'L1 압축본',desc:'주제마다 핵심 키워드와 수치만 남긴 요약',when:'D-7 ~ D-5 · 처음 1~2회독'},
        L2:{n:'②',name:'L2 키워드 트리',desc:'Set마다 3~5줄. 보고 L1 내용을 떠올려 보기',when:'D-4 ~ D-2 · 떠올리기 연습'},
        BC:{n:'③',name:'숫자·비교표',desc:'수치·기준값 + 헷갈리는 개념 비교표',when:'D-4부터 매일 한 번'},
        D1:{n:'④',name:'D-1 시트',desc:'★★ 이상 주제 한 줄 + 꼭 외울 수치',when:'시험 전날 · 당일 아침'}};
var pref={blank:false,top:false};try{Object.assign(pref,JSON.parse(S.get('hn2-pref')||'{}'))}catch(e){}
function savePref(){S.set('hn2-pref',JSON.stringify(pref))}

/* ---------- lock ---------- */
function unlock(pw,remember,silent){
  $('go').disabled=true;$('err').textContent=silent?'':'여는 중…';
  decrypt(pw).then(function(d){D=d;if(remember)S.set('hn2-pw',pw);$('lock').hidden=true;$('app').hidden=false;$('err').textContent='';route()})
  .catch(function(){if(silent){S.del('hn2-pw');$('err').textContent=''}else{$('err').textContent='비밀번호가 맞지 않습니다.';$('pin').select()}})
  .then(function(){$('go').disabled=false});
}
$('lockForm').addEventListener('submit',function(e){e.preventDefault();unlock($('pin').value.trim(),$('rem').checked,false)});
$('lockBtn').addEventListener('click',function(){S.del('hn2-pw');location.hash='#/';location.reload()});
if(!(window.crypto&&crypto.subtle)){$('err').textContent='이 브라우저에서는 열 수 없습니다. 최신 Chrome·Safari로 열어 주세요.'}
else{var saved=S.get('hn2-pw');if(saved)unlock(saved,true,true)}

/* ---------- menu ---------- */
function sheet(on){$('sheet').classList.toggle('on',on);$('sheetBg').classList.toggle('on',on)}
$('menuBtn').addEventListener('click',function(){sheet(true)});$('sheetBg').addEventListener('click',function(){sheet(false)});
$('sheet').addEventListener('click',function(e){if(e.target.closest('a'))sheet(false)});
$('back').addEventListener('click',function(){var h=location.hash.split('/');if(h.length>2){location.hash=h.slice(0,2).join('/')}else{location.hash='#/'}});

/* ---------- helpers ---------- */
function partOf(pid){return D.parts.filter(function(p){return p.id===pid})[0]}
function has(lv,key){return !!D[lv][key]}
function seq(lv){var out=[];D.parts.forEach(function(p){p.sets.forEach(function(s){var k=p.id+'-'+s.no;if(has(lv,k))out.push(k)})});return out}
function setInfo(key){var a=key.split('-'),p=partOf(a[0]);return{part:p,set:p.sets.filter(function(s){return s.no===a[1]})[0]}}
function isRead(lv,key){return S.get('hn2-read:'+lv+':'+key)==='1'}
function head(crumb,title){$('crumb').textContent=crumb;$('ttl').textContent=title;$('back').style.visibility=location.hash.length>2?'visible':'hidden'}
function tools(lv){
  var t='<div class="tools"><button class="tg" data-t="blank" aria-pressed="'+pref.blank+'">빈칸 모드</button>';
  if(lv==='L1')t+='<button class="tg" data-t="top" aria-pressed="'+pref.top+'">★★ 이상만</button>';
  t+='<button class="tg" data-t="reveal">모두 펼치기</button></div>';
  t+='<p class="hint" id="hint"'+(pref.blank?'':' hidden')+'>가려진 곳을 누르면 하나씩 보입니다.</p>';return t}
function applyFlags(){var v=$('view');v.classList.toggle('blank',pref.blank);v.classList.toggle('toponly',pref.top)}

/* ---------- views ---------- */
function vHome(){
  head('','보건 임용 압축노트');
  var last=S.get('hn2-last'),h='<div class="wrap"><div class="hero"><h1>보건 임용<br>압축노트</h1><p>『'+esc(D.book)+'』 '+D.pages+'쪽을 시험 전 일주일 회독용으로 줄였습니다. 순서는 원본 차례 그대로입니다.</p></div>';
  if(last){try{var L=JSON.parse(last),inf=setInfo(L.key);h+='<a class="card resume" href="#/'+L.lv+'/'+L.key+'"><div><small>이어서 보기 · '+LV[L.lv].name+'</small><b>'+esc(inf.part.short)+' Set '+inf.set.no+' '+esc(inf.set.title)+'</b></div><span class="chev">›</span></a>'}catch(e){}}
  h+='<a class="card resume" href="#/guide"><div><small>처음이라면 먼저</small><b>📖 이 자료 사용법</b></div><span class="chev">›</span></a>';
  h+='<div class="sec-t">자료 4종 · 위에서 아래로 갈수록 시험일에 가깝게</div>';
  ['L1','L2','BC','D1'].forEach(function(k){var l=LV[k];h+='<a class="card lv" href="#/'+k+'"><div class="lv-n">'+l.n+'</div><div><h3>'+l.name+'</h3><p>'+l.desc+'</p><span class="when">'+l.when+'</span></div></a>'});
  h+='<div class="sec-t">별표 = 출제자가 핵심으로 보는 영역</div><div class="card legend"><span class="st st3">★★★</span><span>기출 2회 이상</span><span class="st st2">★★</span><span>2014학년도 이후 1회</span><span class="st st1">★</span><span>2013학년도 이전 1회</span><span class="st st0">☆</span><span>미출제 · 건너뛰지 않기</span></div>';
  h+='<div class="foot">현재 성인간호 순환계(Set 014–023)만 들어 있습니다.</div></div>';
  return h}

function vGuide(){
  head('처음 보는 분께','이 자료 사용법');
  return '<div class="wrap g">'+
  '<h2>이 자료는</h2><p>『'+esc(D.book)+'』('+D.pages+'쪽)을 시험 전 일주일 동안 여러 번 돌려 볼 수 있게 줄인 것입니다. 원본 차례(편 → Set → 주제) 순서 그대로라서, 원본에서 공부한 위치 그대로 머리에 남습니다.</p>'+
  '<h2>자료 4종</h2><p>같은 내용을 점점 짧게 줄인 것입니다. ①에서 ④로 갈수록 시험일에 가깝게 봅니다.</p><ul>'+
  ['L1','L2','BC','D1'].map(function(k){return '<li><b>'+LV[k].n+' '+LV[k].name+'</b> — '+LV[k].desc+' <span class="pgc">('+LV[k].when+')</span></li>'}).join('')+'</ul>'+
  '<h2>용어</h2><div class="tbl"><table><tbody>'+
  [['편','원본의 큰 단원. 제1편 지역사회간호 ~ 제5편 아동간호, 부록'],['Set','원본의 중단원. 예: 제3편 Set 016 허혈성 심질환'],['주제 번호','원본 파란 네모 안 번호. 예: 81 협심증'],['형광펜 글씨','서술형 답안에 그대로 써야 하는 키워드'],['p.327','원본 쪽수. 헷갈리면 원본을 펴서 확인'],['16·26','기출 학년도. 2016·2026학년도']].map(function(r){return '<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>'}).join('')+
  '</tbody></table></div>'+
  '<h2>별표 기준</h2><p>별표는 ‘또 나온다’는 예측이 아니라 ‘출제자가 핵심으로 보는 영역’ 표시입니다. 같은 주제는 보통 8~10년 간격으로 다시 나왔고(방실블록 2016→2026), 2014학년도부터 지금의 기입형·서술형 체제입니다.</p>'+
  '<div class="card legend"><span class="st st3">★★★</span><span>기출 2회 이상 — 굵은 글씨까지 손으로 써 보기</span><span class="st st2">★★</span><span>2014학년도 이후 1회 — 키워드 위주</span><span class="st st1">★</span><span>2013학년도 이전 1회 — 서술형으로 다시 나올 여지</span><span class="st st0">☆</span><span>미출제 — 건너뛰지 말 것</span></div>'+
  '<h2>일주일 공부법</h2><div class="tbl"><table><tbody>'+
  [['D-7·D-6','① L1 처음부터 끝까지 1회독. 형광펜 글씨는 소리 내어 읽고, 막히면 쪽수 보고 원본 확인'],['D-5','① L1 2회독. ‘★★ 이상만’ 켜고 먼저, 그다음 전체'],['D-4','② L2 줄만 보고 L1 내용 말해 보기. 막힌 Set은 ‘읽음’을 꺼 두고 L1로 확인. ③ 1회'],['D-3','② L2 2회. ③은 ‘빈칸 모드’로 가리고 맞혀 보기'],['D-2','막혔던 Set만 ① L1로 다시. ③ 1회'],['D-1','④ D-1 시트 + ③ 숫자'],['당일 아침','④ D-1 시트만']].map(function(r){return '<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>'}).join('')+
  '</tbody></table></div>'+
  '<h2>이 페이지 쓰는 법</h2><ul><li><b>빈칸 모드</b>: 키워드가 가려집니다. 누르면 하나씩 보입니다.</li><li><b>★★ 이상만</b>: L1에서 중요 주제만 남깁니다.</li><li><b>읽음</b>: Set 아래쪽 버튼. 목차에 ✓가 생기고 진행률이 올라갑니다.</li><li><b>이전 / 다음</b>: 원본 순서대로 다음 Set으로 넘어갑니다.</li><li>오른쪽 위 ☰에서 언제든 다른 자료로 이동합니다.</li></ul>'+
  '<div class="foot">개인 학습용 · 공유 금지</div></div>'}

function vIndex(lv){
  var l=LV[lv];head(l.n+' '+l.name,'목차');
  if(lv==='D1')return vD1();
  var cur=S.get('hn2-part:'+lv);var firstWith=null;
  D.parts.forEach(function(p){if(!firstWith&&p.sets.some(function(s){return has(lv,p.id+'-'+s.no)}))firstWith=p.id});
  if(!cur||!partOf(cur))cur=firstWith||'p1';
  var h='<div class="wrap"><div class="chips">';
  D.parts.forEach(function(p){var n=p.sets.filter(function(s){return has(lv,p.id+'-'+s.no)}).length;
    h+='<button class="chip" data-part="'+p.id+'" aria-pressed="'+(p.id===cur)+'">'+esc(p.short)+(n?'<span class="cnt">'+n+'</span>':'')+'</button>'});
  h+='</div>';
  var p=partOf(cur),avail=p.sets.filter(function(s){return has(lv,p.id+'-'+s.no)}),read=avail.filter(function(s){return isRead(lv,p.id+'-'+s.no)});
  h+='<div class="sec-t" style="margin-top:14px">'+esc(p.name)+' · '+avail.length+'/'+p.sets.length+' Set 준비됨 · 읽음 '+read.length+'</div>';
  if(avail.length)h+='<div class="prog"><i style="width:'+(read.length/avail.length*100)+'%"></i></div>';
  if(!p.sets.length)h+='<p class="empty">준비 중입니다.</p>';
  p.sets.forEach(function(s){var k=p.id+'-'+s.no,ok=has(lv,k);
    h+='<a class="row'+(ok?'':' off')+'" href="#/'+lv+'/'+k+'"><span class="no">'+s.no+'</span><span class="tt">'+esc(s.title)+'</span><span class="pg">'+(ok?'p.'+s.page:'준비 중')+'</span><span class="ok">'+(isRead(lv,k)?'✓':'')+'</span></a>'});
  return h+'</div>'}

function topicHTML(t){
  var h='<article class="topic s'+t.st+'"><div class="t-h"><span class="t-no">'+t.no+'</span><span class="t-t">'+esc(t.title)+'</span><span class="st st'+t.st+'">'+STAR[t.st]+'</span><span class="t-m">'+(t.yr?t.yr+' · ':'')+'p.'+t.page+'</span></div><ul class="lines">';
  t.lines.forEach(function(x){h+='<li>'+(x.l?'<span class="lb">'+esc(x.l)+'</span> ':'')+kw(x.t);
    if(x.s&&x.s.length)h+='<ol class="subs">'+x.s.map(function(s){return '<li>'+kw(s)+'</li>'}).join('')+'</ol>';h+='</li>'});
  return h+'</ul></article>'}
function table(headers,rows,blankCells){
  return '<div class="tbl"><table><thead><tr>'+headers.map(function(x){return '<th>'+esc(x||'구분')+'</th>'}).join('')+'</tr></thead><tbody>'+
   rows.map(function(r){return '<tr>'+r.map(function(c,i){return i===0?'<th>'+kw(c)+'</th>':'<td><span class="'+(blankCells?'kb':'')+'">'+kw(c)+'</span></td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}

function vSet(lv,key){
  var inf=setInfo(key),l=LV[lv];if(!inf.set||!has(lv,key))return '<p class="empty">준비 중입니다.</p>';
  head(l.n+' '+l.name+' · '+inf.part.short,'Set '+inf.set.no+' '+inf.set.title);
  S.set('hn2-last',JSON.stringify({lv:lv,key:key}));S.set('hn2-part:'+lv,inf.part.id);
  var h='<div class="wrap"><div class="set-h"><div class="crumb">'+esc(inf.part.name)+' · Set '+inf.set.no+' · p.'+inf.set.page+'</div><h2>'+esc(inf.set.title)+'</h2></div>'+tools(lv);
  if(lv==='L1')D.L1[key].topics.forEach(function(t){h+=topicHTML(t)});
  if(lv==='L2')h+='<div class="tree"><ul class="lines">'+D.L2[key].map(function(x){return '<li>'+kw(x)+'</li>'}).join('')+'</ul></div><p class="note">줄만 보고 주제별 내용을 말해 보세요. 막히면 <a href="#/L1/'+key+'">① L1 이 Set</a>으로.</p>';
  if(lv==='BC'){var b=D.BC[key];
    if(b.bp)h+='<div class="blk-t">고혈압 분류 <small>p.'+b.bp.page+'</small></div>'+table(b.bp.headers,b.bp.rows,true);
    if(b.nums)h+='<div class="blk-t">숫자</div>'+table(['항목','값','쪽'],b.nums.map(function(n){return [n[0],n[1],'p.'+n[2]]}),true);
    (b.cmp||[]).forEach(function(c){h+='<div class="blk-t">비교 · '+esc(c.title)+' <small>p.'+c.page+'</small></div>'+table(c.headers,c.rows,true)})}
  h+='</div>';
  var sq=seq(lv),i=sq.indexOf(key),prev=sq[i-1],next=sq[i+1];
  function lab(k){var x=setInfo(k);return 'Set '+x.set.no+' '+x.set.title}
  h+='<nav class="botnav"><div class="wrap"><a class="nb'+(prev?'':' dis')+'" href="'+(prev?'#/'+lv+'/'+prev:'#')+'">‹ '+(prev?esc(lab(prev)):'처음')+'</a>'+
     '<button class="nb read" id="readBtn" aria-pressed="'+isRead(lv,key)+'" style="flex:0 0 76px">'+(isRead(lv,key)?'읽음 ✓':'읽음')+'</button>'+
     '<a class="nb'+(next?'':' dis')+'" href="'+(next?'#/'+lv+'/'+next:'#')+'">'+(next?esc(lab(next)):'끝')+' ›</a></div></nav>';
  setTimeout(function(){var rb=$('readBtn');if(rb)rb.addEventListener('click',function(){var on=!isRead(lv,key);if(on)S.set('hn2-read:'+lv+':'+key,'1');else S.del('hn2-read:'+lv+':'+key);rb.setAttribute('aria-pressed',on);rb.textContent=on?'읽음 ✓':'읽음';if(on&&next)setTimeout(function(){location.hash='#/'+lv+'/'+next},250)})},0);
  return h}

function vD1(){
  head('④ D-1 시트','★★ 이상 + 꼭 외울 수치');
  var h='<div class="wrap">'+tools('D1');
  D.parts.forEach(function(p){var rows=D.D1[p.id];if(!rows)return;
    h+='<div class="sec-t" style="font-size:14px;color:var(--text)">'+esc(p.name)+'</div>';var cur=null;
    rows.forEach(function(r){if(r.set!==cur){cur=r.set;var s=p.sets.filter(function(x){return x.no===r.set})[0];h+='<div class="blk-t" style="margin-top:14px">Set '+r.set+' '+esc(s.title)+'</div>'}
      h+='<div class="d1-row"><span class="t-no">'+r.no+'</span><div><b>'+esc(r.title)+' <span class="st st'+r.st+'">'+STAR[r.st]+'</span></b><div>'+kw(r.line)+'</div></div></div>'});
    if(D.must[p.id])h+='<div class="blk-t" style="margin-top:22px">꼭 외울 수치</div><ul class="must">'+D.must[p.id].map(function(x){return '<li>'+kw(x)+'</li>'}).join('')+'</ul>'});
  return h+'</div>'}

/* ---------- router ---------- */
function route(){
  if(!D)return;sheet(false);
  var h=location.hash.replace(/^#\/?/,'').split('/'),lv=h[0],key=h[1],v=$('view'),html;
  if(!lv)html=vHome();else if(lv==='guide')html=vGuide();
  else if(LV[lv]&&key)html=vSet(lv,key);else if(LV[lv])html=vIndex(lv);else html=vHome();
  v.innerHTML=html;applyFlags();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('click',function(e){
  var c=e.target.closest('.chip');if(c){S.set('hn2-part:'+location.hash.split('/')[1],c.dataset.part);route();return}
  var t=e.target.closest('.tg');if(t){var k=t.dataset.t;
    if(k==='reveal'){document.querySelectorAll('#view .k,#view .kb').forEach(function(x){x.classList.add('show')});return}
    pref[k]=!pref[k];savePref();t.setAttribute('aria-pressed',pref[k]);applyFlags();
    if(k==='blank'){var hn=$('hint');if(hn)hn.hidden=!pref.blank;document.querySelectorAll('#view .show').forEach(function(x){x.classList.remove('show')})}return}
  var kk=e.target.closest('.k,.kb');if(kk&&pref.blank)kk.classList.toggle('show');
});
})();
</script>
